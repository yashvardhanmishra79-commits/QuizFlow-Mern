<body class="h-full flex items-center justify-center bg-surface p-space-md">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-[16px] border border-outline-variant shadow-sm p-space-lg flex flex-col items-center">
<div class="mb-space-xl flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-[48px] mb-space-sm" style="font-variation-settings: 'FILL' 1;">quiz</span>
<h1 class="font-headline-md text-headline-md text-primary font-bold">QuizFlow</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs">Welcome back to the coaching portal</p>
</div>
<form class="w-full flex flex-col gap-space-lg">
<div class="flex flex-col gap-space-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="email" name="email" placeholder="admin@institute.edu" type="email"/>
</div>
</div>
<div class="flex flex-col gap-space-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full h-12 mt-space-sm bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors flex items-center justify-center shadow-[0px_4px_6px_-1px_rgba(30,41,59,0.05)] hover:shadow-[0px_10px_15px_-3px_rgba(30,41,59,0.1)] hover:-translate-y-[1px] duration-200" type="submit">
                Login
            </button>
</form>
</div>
