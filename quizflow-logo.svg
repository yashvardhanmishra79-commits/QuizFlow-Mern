<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" role="img" aria-labelledby="title desc">
  <title id="title">QuizFlow</title>
  <desc id="desc">QuizFlow wordmark with a clean violet-to-cyan quiz symbol.</desc>
  <defs>
    <linearGradient id="tile" x1="12" y1="10" x2="148" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17152E"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="mark" x1="37" y1="35" x2="130" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="word" x1="190" y1="48" x2="520" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset=".7" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#A5F3FC"/>
