    <circle cx="69" cy="67" r="40" fill="none" stroke="url(#mark)" stroke-width="9"/>
    <path d="M96 94 L116 114" fill="none" stroke="url(#mark)" stroke-width="9.5" stroke-linecap="round"/>
    <path d="M50 67 L63 80 L86 55" fill="none" stroke="#F5F3FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
